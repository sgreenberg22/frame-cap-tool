name: CI and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy (production uses fly.toml, staging uses fly.staging.toml)"
        type: choice
        options: [production, staging]
        default: production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build
      - run: npm run size --if-present

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e

  deploy:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning title=Deploy skipped::Add a FLY_API_TOKEN repository secret (fly tokens create deploy) to enable deploys."
            exit 0
          fi
          flyctl deploy --remote-only

  deploy-staging:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy staging to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning title=Deploy skipped::Add a FLY_API_TOKEN repository secret (fly tokens create deploy) to enable deploys."
            exit 0
          fi
          flyctl deploy --remote-only --config fly.staging.toml
